name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SoundAnchor
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -OutputName SoundAnchor.exe
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SoundAnchor
          path: dist/SoundAnchor.exe
